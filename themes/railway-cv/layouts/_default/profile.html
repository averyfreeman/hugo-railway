{{ define "main" }}
  <article class="content-page page-shell profile-page">

      <p class="eyebrow">{{ .Title | upper }} / AVERY FREEMAN</p>
      <h1>{{ .Title }}</h1>

    <div class="content-page__body prose">{{ .Content }}</div>
  </article>
{{ end }}
