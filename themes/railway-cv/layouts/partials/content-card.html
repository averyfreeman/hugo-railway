<a class="archive-card card signal-surface" href="{{ .RelPermalink }}" data-reveal="up">
  <div class="archive-card__top"><span>{{ .Section | upper }}</span><span>{{ .Date.Format "2006" }}</span></div>
  <h2>{{ .Title }}</h2>
  <p>{{ .Summary }}</p>
  <span class="text-link">Open resource <span aria-hidden="true">↗</span></span>
</a>
